<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bible Reader – Books & Chapters</title>
<style>
  body { margin: 0; font-family: sans-serif; }
  #sidebar {
    position: fixed; top: 0; left: 0; width: 200px; height: 100vh;
    background: #f7f7f7; border-right: 1px solid #ccc; padding: 10px;
    overflow-y: auto;
  }
  #sidebar a { display: block; margin-bottom: 5px; text-decoration: none; color: #333; }
  #sidebar a:hover { text-decoration: underline; }
  #main { margin-left: 220px; padding: 20px; }
  .version-box { margin-bottom: 20px; }
  .book-section { margin-bottom: 60px; }
  .book-title { font-size: 1.5em; margin-top: 40px; }
  .chapters {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(40px,1fr));
    gap:5px;
    max-width: 800px;
  }
  .chapters button {
    padding:5px; background:#eef; border:none; border-radius:3px; cursor:pointer;
  }
  .chapters button:hover { background:#cce; }
</style>
</head>
<body>

<div id="sidebar">
  <h3>Jump to Book</h3>
  {% for id, name in books %}
    <a href="#book-{{ id }}">{{ name }}</a>
  {% endfor %}
</div>

<div id="main">
  <form id="selectForm" class="version-box">
    <strong>Select up to 2 versions:</strong><br>
    {% for code,label in versions %}
      <label>
        <input type="checkbox" name="version" value="{{ code }}"
          {% if code in selected %}checked{% endif %}>
        {{ label }}
      </label><br>
    {% endfor %}
  </form>

  {% for id, name in books %}
    <div id="book-{{ id }}" class="book-section">
      <div class="book-title">{{ name }}</div>
      <div class="chapters">
        {% for ch in range(1, 151) %}
          <button type="button"
                  onclick="openChapter({{ id }},{{ ch }})">{{ ch }}</button>
        {% endfor %}
      </div>
    </div>
  {% endfor %}
</div>

<script>
function openChapter(bookId, ch) {
  const vers = Array.from(document.querySelectorAll('input[name="version"]:checked'))
                     .map(cb => 'version=' + encodeURIComponent(cb.value))
                     .join('&');
  location.href = `/chapter?book_id=${bookId}&chapter=${ch}&${vers}`;
}
</script>

</body>
</html>
