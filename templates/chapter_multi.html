<!DOCTYPE html>
<html>
<head>
    <title>{{ book_name }} Chapter {{ chapter_num }}</title>
    <style>
        .verse-table { border-collapse: collapse; width: 100%; }
        .verse-table th, .verse-table td { border: 1px solid #bbb; padding: 6px; }
        .verse-table th { background: #eee; }
        .edit-link { color: blue; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>
    <a href="/">&#8592; Back to Books</a>
    <h2>{{ book_name }} Chapter {{ chapter_num }}</h2>
    <table class="verse-table">
        <thead>
            <tr>
                <th>Verse</th>
                {% for v in versions %}
                <th>{{ v }}</th>
                {% endfor %}
                <th>My Note</th>
            </tr>
        </thead>
        <tbody>
            {% for row in verse_rows %}
            <tr>
                <td>{{ row.verse }}</td>
                {% for v in versions %}
                <td>{{ row[v] }}</td>
                {% endfor %}
                <td>
                    <span id="note-text-{{ row.verse }}">{{ row.note }}</span>
                    <span id="edit-btn-{{ row.verse }}" class="edit-link" onclick="editNote({{ row.verse }})">Edit</span>
                    <span id="note-form-{{ row.verse }}" style="display:none;">
                        <input type="text" id="note-input-{{ row.verse }}" value="{{ row.note|e }}" size="40">
                        <button type="button" onclick="saveNote({{ book_id }}, {{ chapter_num }}, {{ row.verse }})">Save</button>
                        <button type="button" onclick="cancelEdit({{ row.verse }})">Cancel</button>
                    </span>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

<script>
function editNote(verse) {
    document.getElementById('note-form-' + verse).style.display = '';
    document.getElementById('note-text-' + verse).style.display = 'none';
    document.getElementById('edit-btn-' + verse).style.display = 'none';
}
function saveNote(book_id, chapter, verse) {
    let noteInput = document.getElementById('note-input-' + verse);
    fetch("/save_note", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            book_id: book_id,
            chapter: chapter,
            verse: verse,
            note: noteInput.value
        })
    }).then(r => r.json()).then(data => {
        if (data.success) {
            document.getElementById('note-text-' + verse).innerText = noteInput.value;
            document.getElementById('note-form-' + verse).style.display = 'none';
            document.getElementById('note-text-' + verse).style.display = '';
            document.getElementById('edit-btn-' + verse).style.display = '';
        }
    });
}
function cancelEdit(verse) {
    document.getElementById('note-form-' + verse).style.display = 'none';
    document.getElementById('note-text-' + verse).style.display = '';
    document.getElementById('edit-btn-' + verse).style.display = '';
}
</script>
</body>
</html>
