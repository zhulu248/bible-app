<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ book_name }} Chapter {{ chapter_num }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        table { border-collapse: collapse; margin-bottom: 18px; width: 100%; }
        th, td { border: 1px solid #aaa; padding: 4px 7px; text-align: left; }
        th { background: #f0f7ff; }
        tr:nth-child(even) { background: #f9f9f9; }
        .back { margin-bottom: 20px; }
    </style>
</head>
<body>
    <h2>{{ book_name }} Chapter {{ chapter_num }}</h2>
    <table>
        <tr>
            <th>Verse</th>
            {% for v in versions %}
                <th>{{ v }}</th>
            {% endfor %}
        </tr>
        {% for verse_row in verses_data %}
        <tr>
            <td>{{ verse_row.verse }}</td>
            {% for v in versions %}
                <td>
                    {{ verse_row[v] if verse_row[v] else "&mdash;" }}
                </td>
            {% endfor %}
        </tr>
        {% endfor %}
    </table>
    <div class="back">
        <a href="{{ url_for('index', version=versions) }}">&larr; Back to Books/Chapters</a>
    </div>
</body>
</html>
