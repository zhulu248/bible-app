<!DOCTYPE html>
<html>
<head>
    <title>Parallel Bible Viewer</title>
    <style>
        .sidebar { float: left; width: 180px; background: #f0f0f0; height: 100vh; padding: 10px; }
        .content { margin-left: 200px; padding: 10px; }
        .chapter-grid { display: grid; grid-template-columns: repeat(12, 32px); grid-gap: 4px; }
        .chapter-cell { background: #eef; border: 1px solid #ccc; text-align: center; padding: 2px 0; }
        .chapter-cell a { display: block; color: #005; text-decoration: none; }
        .chapter-cell a:hover { background: #ccf; }
    </style>
</head>
<body>
    <div class="sidebar">
        <b>Bible Books</b>
        <ul style="list-style: none; padding: 0;">
            {% for book in books %}
            <li><a href="#book-{{ book.id }}">{{ book.name }}</a></li>
            {% endfor %}
        </ul>
    </div>
    <div class="content">
        <h2>Choose Bible Versions (up to 2):</h2>
        <form method="get" action="/" id="version-form">
            {% for code, name in available_versions %}
                <input type="checkbox" name="version" value="{{ code }}"
                    {% if code in selected_versions %}checked{% endif %}>
                {{ name }}
            {% endfor %}
            <input type="submit" value="Apply">
        </form>
        <script>
            // Prevent selecting more than 2 versions
            document.addEventListener('DOMContentLoaded', function() {
                const checkboxes = document.querySelectorAll('input[type="checkbox"][name="version"]');
                checkboxes.forEach(cb => {
                    cb.addEventListener('change', function() {
                        let checked = document.querySelectorAll('input[type="checkbox"][name="version"]:checked');
                        if (checked.length > 2) {
                            this.checked = false;
                            alert('Please select no more than 2 versions.');
                        }
                    });
                });
            });
        </script>
        <hr>
        {% for book in books %}
            <h3 id="book-{{ book.id }}">{{ book.name }}</h3>
            <div class="chapter-grid">
                {% for ch in book.chapters %}
                <div class="chapter-cell">
                    <a href="{{ url_for('show_chapter', book_id=book.id, chapter_num=ch) }}?{% for v in selected_versions %}version={{ v }}&{% endfor %}">{{ ch }}</a>
                </div>
                {% endfor %}
            </div>
            <br>
        {% endfor %}
    </div>
</body>
</html>
